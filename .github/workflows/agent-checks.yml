name: Agent checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Installed skills match skills-lock.json
        run: node .agents/skills/agent-tooling/scripts/check-installed-skills.mjs
      - name: Skill extensions are read by their skill files
        run: node .agents/skills/agent-tooling/scripts/check-skill-extensions.mjs
      - name: Links in agent files resolve
        run: npm run check:agent-links
